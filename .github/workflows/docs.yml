name: Docs

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JULIA_CONDAPKG_BACKEND: "Null"
      JULIA_PYTHONCALL_EXE: python
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Python pybtex
        run: python -m pip install pybtex

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(; path = pwd())
            Pkg.instantiate()
          '

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl

      - name: Ensure .nojekyll in gh-pages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          if [ ! -f /tmp/gh-pages/.nojekyll ]; then
            touch /tmp/gh-pages/.nojekyll
            cd /tmp/gh-pages
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add .nojekyll
            git commit -m "Add .nojekyll to disable Jekyll processing"
            git push
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
